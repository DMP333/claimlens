name: Build and Publish to ECR

# Run on every push to main. The build+publish job always runs (works whether or
# not the instance is up). The deploy-to-instance job is manual-only (see below).
on:
  push:
    branches: [main]
  workflow_dispatch:   # also allow manual runs from the Actions tab

# OIDC needs permission to request the token; contents:read to check out code.
permissions:
  id-token: write
  contents: read

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      # Exchange GitHub's OIDC token for temporary AWS credentials by assuming
      # the role. No stored AWS secret: the role's trust policy verifies this is
      # our repo, then hands back short-lived creds that expire in ~1 hour.
      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      # Log Docker in to ECR using those temporary creds.
      - name: Log in to Amazon ECR
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2

      # Build the image and push ONE immutable tag: the commit SHA. The repo is
      # configured immutable (tags can never be overwritten), so we do NOT push a
      # moving "latest" tag. Every image is traceable to an exact commit, and the
      # deploy step pulls by this exact SHA, no ambiguity about what is running.
      - name: Build and push image
        env:
          ECR_REPO: ${{ vars.ECR_REPOSITORY }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build -t "$ECR_REPO:$IMAGE_TAG" .
          docker push "$ECR_REPO:$IMAGE_TAG"
          echo "Pushed $ECR_REPO:$IMAGE_TAG"