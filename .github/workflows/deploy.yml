name: Build and Publish to ECR

# Run on every push to main. The build+publish job always runs (works whether or
# not the instance is up). The deploy-to-instance job is manual-only (see below).
on:
  push:
    branches: [main]
  workflow_dispatch:   # also allow manual runs from the Actions tab

# OIDC needs permission to request the token; contents:read to check out code.
permissions:
  id-token: write
  contents: read

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      # Exchange GitHub's OIDC token for temporary AWS credentials by assuming
      # the role. No stored AWS secret: the role's trust policy verifies this is
      # our repo, then hands back short-lived creds that expire in ~1 hour.
      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      # Log Docker in to ECR using those temporary creds.
      - name: Log in to Amazon ECR
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2

      # Build the image and push ONE immutable tag: the commit SHA. The repo is
      # configured immutable (tags can never be overwritten), so we do NOT push a
      # moving "latest" tag. Every image is traceable to an exact commit, and the
      # deploy step pulls by this exact SHA, no ambiguity about what is running.
      - name: Build and push image
        env:
          ECR_REPO: ${{ vars.ECR_REPOSITORY }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build -t "$ECR_REPO:$IMAGE_TAG" .
          docker push "$ECR_REPO:$IMAGE_TAG"
          echo "Pushed $ECR_REPO:$IMAGE_TAG"

  # Second job: tell the instance to pull the just-built image and restart.
  # Runs only after build-and-push succeeds. Uses SSM (no SSH, no open ports,
  # no stored keys): the workflow assumes the OIDC role and calls SSM SendCommand,
  # and the instance's SSM agent picks up the command and runs it.
  deploy:
    needs: build-and-push          # wait for the image to exist in ECR
    runs-on: ubuntu-latest
    steps:
      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      # Send the deploy command to the instance via SSM and wait for it to finish.
      # The command logs in to ECR, pulls the exact SHA just built, and restarts.
      # IMAGE_TAG is passed in so compose pulls precisely this commit's image.
      - name: Deploy to EC2 via SSM
        env:
          INSTANCE_ID: ${{ vars.EC2_INSTANCE_ID }}
          REGION: ${{ vars.AWS_REGION }}
          ECR_REPO: ${{ vars.ECR_REPOSITORY }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          # The shell command the instance will run, as a JSON-safe string.
          REGISTRY="$(echo "$ECR_REPO" | cut -d/ -f1)"
          REMOTE_CMD="sudo -iu ubuntu bash -c 'cd /home/ubuntu/FalseClaimDetector && \
          git fetch origin main && git reset --hard origin/main && \
          aws ecr get-login-password --region $REGION | docker login --username AWS --password-stdin $REGISTRY && \
          IMAGE_TAG=$IMAGE_TAG docker compose pull app && \
          IMAGE_TAG=$IMAGE_TAG docker compose up -d --remove-orphans'"

          # Dispatch the command to the instance's SSM agent.
          COMMAND_ID=$(aws ssm send-command \
            --region "$REGION" \
            --instance-ids "$INSTANCE_ID" \
            --document-name "AWS-RunShellScript" \
            --comment "Deploy ${IMAGE_TAG} from GitHub Actions" \
            --parameters "commands=[\"$REMOTE_CMD\"]" \
            --query "Command.CommandId" --output text)
          echo "SSM command dispatched: $COMMAND_ID"

          # Poll until the command finishes, then report success/failure.
          echo "Waiting for the instance to finish deploying..."
          aws ssm wait command-executed \
            --region "$REGION" \
            --command-id "$COMMAND_ID" \
            --instance-id "$INSTANCE_ID" || true

          STATUS=$(aws ssm get-command-invocation \
            --region "$REGION" \
            --command-id "$COMMAND_ID" \
            --instance-id "$INSTANCE_ID" \
            --query "Status" --output text)
          echo "Deploy status: $STATUS"

          # Print the instance-side output (stdout/stderr) for visibility.
          aws ssm get-command-invocation \
            --region "$REGION" \
            --command-id "$COMMAND_ID" \
            --instance-id "$INSTANCE_ID" \
            --query "StandardOutputContent" --output text
          aws ssm get-command-invocation \
            --region "$REGION" \
            --command-id "$COMMAND_ID" \
            --instance-id "$INSTANCE_ID" \
            --query "StandardErrorContent" --output text

          # Fail the job if the deploy did not succeed.
          if [ "$STATUS" != "Success" ]; then
            echo "Deploy failed with status: $STATUS"
            exit 1
          fi