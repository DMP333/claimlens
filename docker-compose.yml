services: #list of containers this file defines
  db: #the Postgres container
    image: postgres:16 #finished package pulled from Docker Hub (no Dockerfile needed)
    container_name: claimlens-db #name of the running container
    environment: #configuration values handed into the container
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: claimlens
    ports: #publish Postgres to the host (only needed if YOU connect from the Mac)
      - "5432:5432"
    volumes: #mount the data dir to a named volume so rows survive container deletion
      - claimlens_pgdata:/var/lib/postgresql/data
    healthcheck: #lets the app wait until Postgres is actually accepting connections
      test: ["CMD-SHELL", "pg_isready -U postgres -d claimlens"]
      interval: 5s
      timeout: 3s
      retries: 10

  app: #our application container, built from the Dockerfile in this directory
    build: . #build context is this dir; reads ./Dockerfile to produce the image, by convention it refers to Dockerfile
    container_name: claimlens-app
    environment:
      # Inside the compose network the DB is reached by SERVICE NAME (db), not
      # localhost. This explicitly overrides any DATABASE_URL from .env below.
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@db:5432/claimlens
    env_file:
      - .env #compose reads the host .env at up-time and injects the API keys
    ports: #publish the app to the host so the browser can reach localhost:8000
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy #wait for the db healthcheck to pass, not just start
    # No volume: the app is stateless. Everything it produces is written to the DB.

volumes: #declare the named volume the db container mounts
  claimlens_pgdata: